[package]
name = "ghidra-mcp"
version = "1.0.0"
edition = "2021"
description = "Headless Ghidra analysis for MCP clients. Clients can start sessions, decompile code, examine symbols, and change Ghidra programs."
license = "MIT"
repository = "https://github.com/ByteLandTechnology/ghidra-mcp"
readme = "README.md"
keywords = ["ghidra", "mcp", "reverse-engineering", "static-analysis", "decompiler"]
categories = ["development-tools", "command-line-utilities"]
# The source build needs the bridge submodule. Cargo cannot publish it.
publish = false

[workspace]
resolver = "2"
members = ["xtask"]

[dependencies]
anyhow = "1.0.103"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
futures = "0.3"
interprocess = { version = "2.4.4", features = ["tokio"] }
md5 = "0.7"
rmcp = { version = "=3.1.2", default-features = false, features = ["client", "server", "transport-io", "transport-async-rw", "transport-streamable-http-server"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = { version = "3.24.0", default-features = false, features = ["macros"] }
tempfile = "3.27.0"
thiserror = "2.0"
tokio = { version = "1.41", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
uuid = { version = "1.11", features = ["v4"] }
which = "8.0.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }
dunce = "1.0"
widestring = "1.2.1"


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_docs_in_private_items = "warn"
undocumented_unsafe_blocks = "warn"
