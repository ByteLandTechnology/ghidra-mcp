<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 410" width="100%">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="marker-blue" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="marker-gray" />
    </marker>
  </defs>
  <style>
    /* Default / Light theme */
    .part-box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5px; }
    .part-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
    .lifeline { stroke: #d0d7de; stroke-width: 1.5px; stroke-dasharray: 4,4; }

    .msg-line { stroke: #0969da; stroke-width: 1.5px; fill: none; marker-end: url(#arr-blue); }
    .ret-line { stroke: #8c959f; stroke-width: 1.5px; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-gray); }
    .self-line { stroke: #54aeff; stroke-width: 1.5px; fill: none; marker-end: url(#arr-blue); }

    .msg-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1f2328; text-anchor: middle; }
    .msg-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #57606a; text-anchor: middle; }
    .self-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1f2328; }
    .label-bg { fill: #ffffff; }

    .marker-blue { fill: #0969da; }
    .marker-gray { fill: #8c959f; }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      .part-box { fill: #161b22; stroke: #30363d; }
      .part-text { fill: #f0f6fc; }
      .lifeline { stroke: #30363d; }

      .msg-line { stroke: #58a6ff; }
      .ret-line { stroke: #6e7681; }
      .self-line { stroke: #1f6feb; }

      .msg-text { fill: #f0f6fc; }
      .msg-sub { fill: #8b949e; }
      .self-text { fill: #f0f6fc; }
      .label-bg { fill: #0d1117; }

      .marker-blue { fill: #58a6ff; }
      .marker-gray { fill: #6e7681; }
    }
  </style>

  <!-- Lifelines -->
  <line x1="80" y1="50" x2="80" y2="390" class="lifeline" />
  <line x1="300" y1="50" x2="300" y2="390" class="lifeline" />
  <line x1="520" y1="50" x2="520" y2="390" class="lifeline" />
  <line x1="740" y1="50" x2="740" y2="390" class="lifeline" />

  <!-- Participant Headers -->
  <g transform="translate(20, 16)">
    <rect width="120" height="34" rx="6" class="part-box" />
    <text x="60" y="22" class="part-text">MCP Client</text>
  </g>
  <g transform="translate(240, 16)">
    <rect width="120" height="34" rx="6" class="part-box" />
    <text x="60" y="22" class="part-text">stdio proxy</text>
  </g>
  <g transform="translate(460, 16)">
    <rect width="120" height="34" rx="6" class="part-box" />
    <text x="60" y="22" class="part-text">daemon</text>
  </g>
  <g transform="translate(680, 16)">
    <rect width="120" height="34" rx="6" class="part-box" />
    <text x="60" y="22" class="part-text">bridge</text>
  </g>

  <!-- Step 1: C -> P -->
  <path d="M 80 92 L 300 92" class="msg-line" />
  <rect x="95" y="66" width="190" height="22" rx="3" class="label-bg" />
  <text x="190" y="77" class="msg-text">tools/call ghidra_function</text>
  <text x="190" y="87" class="msg-sub">list (md5)</text>

  <!-- Step 2: P -> D -->
  <path d="M 300 130 L 520 130" class="msg-line" />
  <rect x="320" y="113" width="180" height="15" rx="3" class="label-bg" />
  <text x="410" y="124" class="msg-text">tools/call (local socket)</text>

  <!-- Step 3: D validate -->
  <path d="M 520 152 L 565 152 L 565 172 L 522 172" class="self-line" />
  <rect x="570" y="154" width="165" height="16" rx="3" class="label-bg" />
  <text x="572" y="166" class="self-text">find operation, validate params</text>

  <!-- Step 4: D session call -->
  <path d="M 520 192 L 565 192 L 565 212 L 522 212" class="self-line" />
  <rect x="570" y="194" width="165" height="16" rx="3" class="label-bg" />
  <text x="572" y="206" class="self-text">session::call (connect or relaunch)</text>

  <!-- Step 5: D -> B -->
  <path d="M 520 245 L 740 245" class="msg-line" />
  <rect x="545" y="228" width="170" height="15" rx="3" class="label-bg" />
  <text x="630" y="239" class="msg-text">JSON-RPC (WebSocket)</text>

  <!-- Step 6: B -> D -->
  <path d="M 740 285 L 520 285" class="ret-line" />
  <rect x="560" y="268" width="140" height="15" rx="3" class="label-bg" />
  <text x="630" y="279" class="msg-text">JSON-RPC response</text>

  <!-- Step 7: D -> P -->
  <path d="M 520 325 L 300 325" class="ret-line" />
  <rect x="350" y="308" width="120" height="15" rx="3" class="label-bg" />
  <text x="410" y="319" class="msg-text">{"response": …}</text>

  <!-- Step 8: P -> C -->
  <path d="M 300 365 L 80 365" class="ret-line" />
  <rect x="150" y="348" width="80" height="15" rx="3" class="label-bg" />
  <text x="190" y="359" class="msg-text">result</text>
</svg>
