<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="100%">
  <defs>
    <marker id="arr-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="marker-blue" />
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="marker-gray" />
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" class="marker-green" />
    </marker>
  </defs>
  <style>
    /* Default / Light theme */
    .part-box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5px; }
    .part-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #1f2328; text-anchor: middle; }
    .lifeline { stroke: #d0d7de; stroke-width: 1.5px; stroke-dasharray: 4,4; }

    .msg-line { stroke: #0969da; stroke-width: 1.5px; fill: none; marker-end: url(#arr-blue); }
    .ret-line { stroke: #8c959f; stroke-width: 1.5px; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-gray); }
    .succ-line { stroke: #1a7f37; stroke-width: 1.5px; stroke-dasharray: 4,3; fill: none; marker-end: url(#arr-green); }
    .self-line { stroke: #54aeff; stroke-width: 1.5px; fill: none; marker-end: url(#arr-blue); }

    .msg-text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #1f2328; text-anchor: middle; }
    .self-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #1f2328; }
    .succ-text { fill: #1a7f37; font-weight: 600; }
    .acc-text { fill: #0969da; font-weight: 600; }
    .label-bg { fill: #ffffff; }

    .marker-blue { fill: #0969da; }
    .marker-gray { fill: #8c959f; }
    .marker-green { fill: #1a7f37; }

    /* Dark theme */
    @media (prefers-color-scheme: dark) {
      .part-box { fill: #161b22; stroke: #30363d; }
      .part-text { fill: #f0f6fc; }
      .lifeline { stroke: #30363d; }

      .msg-line { stroke: #58a6ff; }
      .ret-line { stroke: #6e7681; }
      .succ-line { stroke: #3fb950; }
      .self-line { stroke: #1f6feb; }

      .msg-text { fill: #f0f6fc; }
      .self-text { fill: #f0f6fc; }
      .succ-text { fill: #3fb950; }
      .acc-text { fill: #58a6ff; }
      .label-bg { fill: #0d1117; }

      .marker-blue { fill: #58a6ff; }
      .marker-gray { fill: #6e7681; }
      .marker-green { fill: #3fb950; }
    }
  </style>

  <!-- Lifelines -->
  <line x1="160" y1="50" x2="160" y2="360" class="lifeline" />
  <line x1="520" y1="50" x2="520" y2="360" class="lifeline" />

  <!-- Participant Headers -->
  <g transform="translate(80, 16)">
    <rect width="160" height="34" rx="6" class="part-box" />
    <text x="80" y="22" class="part-text">Remote Client</text>
  </g>
  <g transform="translate(440, 16)">
    <rect width="160" height="34" rx="6" class="part-box" />
    <text x="80" y="22" class="part-text">Daemon</text>
  </g>

  <!-- Step 1: ghidra_upload prepare -->
  <path d="M 160 85 L 520 85" class="msg-line" />
  <rect x="190" y="68" width="300" height="15" rx="3" class="label-bg" />
  <text x="340" y="79" class="msg-text">ghidra_upload prepare md5 + {fileName, size}</text>

  <!-- Step 2: prepare grant response -->
  <path d="M 520 125 L 160 125" class="ret-line" />
  <rect x="200" y="108" width="280" height="15" rx="3" class="label-bg" />
  <text x="340" y="119" class="msg-text">200 OK: upload URL + Bearer grant</text>

  <!-- Step 3: POST /upload stream -->
  <path d="M 160 170 L 520 170" class="msg-line" />
  <rect x="220" y="153" width="240" height="15" rx="3" class="label-bg" />
  <text x="340" y="164" class="msg-text">POST /upload (raw binary stream)</text>

  <!-- Step 4: Daemon validate & ingest -->
  <path d="M 520 195 L 565 195 L 565 215 L 522 215" class="self-line" />
  <rect x="570" y="197" width="180" height="16" rx="3" class="label-bg" />
  <text x="572" y="209" class="self-text">verify Host/Origin + Bearer</text>

  <path d="M 520 230 L 565 230 L 565 250 L 522 250" class="self-line" />
  <rect x="570" y="232" width="180" height="16" rx="3" class="label-bg" />
  <text x="572" y="244" class="self-text">stream to tmp/, verify MD5</text>

  <path d="M 520 265 L 565 265 L 565 285 L 522 285" class="self-line" />
  <rect x="570" y="267" width="180" height="16" rx="3" class="label-bg" />
  <text x="572" y="279" class="self-text">persist binary, open session</text>

  <!-- Step 5: Response -->
  <path d="M 520 325 L 160 325" class="succ-line" />
  <rect x="180" y="308" width="320" height="15" rx="3" class="label-bg" />
  <text x="340" y="319" class="msg-text"><tspan class="succ-text">200 OK</tspan> (ready) or <tspan class="acc-text">202 Accepted</tspan> (starting)</text>
</svg>
