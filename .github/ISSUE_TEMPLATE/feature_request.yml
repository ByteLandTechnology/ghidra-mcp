name: Feature request
description: Suggest a change to ghidra-mcp.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Tell what you want to do, and what stops you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the new behavior, for example a command, an argument or an option.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other solutions
